name: Deploy to HF Spaces

on:
  push:
    branches: [ claude/web-content-accessibility-32xdqn ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: CI=true npm run build

      - name: Add HF Spaces metadata
        run: cp hf-space-readme.md build/README.md

      - name: Configure Git
        run: |
          git config user.email "billingsmoore@gmail.com"
          git config user.name "billingsmoore"

      - name: Push build to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd build
          git init
          git add .
          git commit -m "Deploy: ${{ github.sha }}"
          git push --force "https://billingsmoore:${HF_TOKEN}@huggingface.co/spaces/billingsmoore/test" HEAD:main
